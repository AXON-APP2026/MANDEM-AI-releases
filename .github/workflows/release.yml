# ─────────────────────────────────────────────────────────────────────────────
# COPY THIS FILE INTO THE PUBLIC REPO:
#   AXON-APP2026/MANDEM-AI-releases  →  .github/workflows/release.yml
#
# It does NOT run from here (it lives outside .github/workflows/ in the private
# repo on purpose). Public repos get FREE, unlimited GitHub Actions — including
# macOS, which bills 10× on private repos — on a quota separate from the private
# repo's. So release CI moves here while the private source stays private.
#
# THIS FILE MUST STAY IN LOCKSTEP WITH .github/workflows/release.yml IN THIS
# REPO (the private "aligned reference" copy) — same Node pin (.nvmrc /
# package.json engines.node), same cache/retry strategy, same step order. When
# one changes for a toolchain/reliability reason, copy the change into the
# other by hand and re-paste this file into the public repo. See
# docs/RELEASE-CI.md for the full rationale and the local Windows repro steps.
#
# Required in the PUBLIC repo (Settings → Secrets and variables → Actions):
#   Secrets:
#     SOURCE_TOKEN                 PAT with `contents: read` on AXON-APP2026/MANDEM-AI
#     APPLE_CERTIFICATE_BASE64     base64 of the Developer ID .p12
#     APPLE_CERTIFICATE_PASSWORD   password for that .p12
#     APPLE_ID                     Apple ID email (notarisation)
#     APPLE_APP_SPECIFIC_PASSWORD  app-specific password (notarisation)
#     APPLE_TEAM_ID                Apple Developer Team ID
#     (GITHUB_TOKEN is automatic — no need to create it.)
#   Variables:
#     VITE_HUB_URL, VITE_HELP_URL, VITE_GOOGLE_CLIENT_ID, VITE_GOOGLE_CLIENT_SECRET
#     (optional) VITE_GMAIL_READONLY, VITE_MS_CLIENT_ID
# ─────────────────────────────────────────────────────────────────────────────
name: Release installers

# Release-provenance hardening, round 2 (01/10/2026) — this workflow builds
# ONLY via workflow_dispatch, supplying THREE required inputs: `ref` (the
# private MANDEM-AI version tag), `expected_sha` (the exact commit that tag
# is approved to resolve to), and `dry_run` (defaults true — verify + build
# only, never sign/notarise/publish). The previous `push: tags: v*` trigger
# is removed entirely: every tag in this public repo has always pointed at
# the same static workflow-file commit (never a meaningful source snapshot —
# see the release-provenance report), a plain tag push has no way to supply
# expected_sha, and in practice every real build here has already been
# workflow_dispatch (this repo's Actions history has zero real tag-push
# builds). Removing the trigger — rather than keeping the step that refused
# it — removes the confusing zero-job "failure" runs that refusal produced.
# Never pull_request either: this is a public repo, and a fork PR must never
# be able to reach the signing/notarisation secrets.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "REQUIRED. Immutable private MANDEM-AI version tag to build, e.g. v0.11.2 — must already exist on AXON-APP2026/MANDEM-AI. Strict vMAJOR.MINOR.PATCH format only; branch names (including main) are rejected."
        required: true
        type: string
      expected_sha:
        description: "REQUIRED. The approved full private-source commit SHA (exactly 40 hex characters, not abbreviated) that tag must resolve to. The build refuses on any mismatch."
        required: true
        type: string
      dry_run:
        description: "true (default): validate provenance, install, verify, typecheck and build — but never sign, notarise or publish. false: full release path, subject to every guard passing."
        required: true
        default: true
        type: boolean

permissions:
  contents: write # needed to create the GitHub Release in THIS repo (real runs only)

# One in-flight run per requested version — a second trigger for the SAME
# ref queues rather than racing a concurrent publish; a later run never
# cancels an in-progress one (cancelling mid-publish could leave a release
# half-updated). Different versions are independent and do not share a lock.
concurrency:
  group: release-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Workflow inputs, bound to env vars ONCE here so every later `run:`
      # block references $PRIVATE_REF / $EXPECTED_SHA / $DRY_RUN rather than
      # interpolating ${{ inputs.* }} directly into a shell body (the latter
      # is the standard GitHub Actions script-injection pattern — this repo
      # is public, and workflow_dispatch inputs are operator-supplied free
      # text). `with:` parameters (e.g. the checkout step's `ref:`) are not
      # shell-interpolated by Actions, so referencing ${{ inputs.ref }}
      # there directly remains safe and is left as-is.
      PRIVATE_REF: ${{ inputs.ref }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      DRY_RUN: ${{ inputs.dry_run }}
      # Explicit + bounded, never infinite. These govern npm's OWN registry
      # fetches (package metadata + tarballs) — Electron's binary download is a
      # separate HTTP request the `electron` package's postinstall makes via
      # @electron/get, which doesn't read these; that download is made reliable
      # instead by caching (below) plus retrying the whole `npm ci` on failure.
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      NPM_CONFIG_FETCH_RETRIES: "5"
      NPM_CONFIG_FETCH_RETRY_FACTOR: "2"
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "15000"
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
      NPM_CONFIG_FETCH_TIMEOUT: "300000"
      # Fixed, OS-agnostic-in-YAML cache locations for the Electron binary
      # download (`electron` package postinstall) and electron-builder's own
      # auxiliary tool downloads (nsis, winCodeSign, etc.). runner.temp already
      # resolves to a real per-OS writable path (incl. Windows), so no manual
      # per-OS branching is needed here — only the cache step below needs to
      # know the OS, for the cache key.
      ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
      ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
    steps:
      # ── INPUT VALIDATION — fails closed before anything else runs. A
      # malformed/abbreviated/branch-like value never reaches checkout.
      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "${PRIVATE_REF}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid ref '${PRIVATE_REF}' — must be a strict version tag (vMAJOR.MINOR.PATCH, e.g. v0.11.2). Branch names (including main), paths, and shell metacharacters are all rejected by this exact-match pattern."
            exit 1
          fi
          sha_lc="$(printf '%s' "${EXPECTED_SHA}" | tr '[:upper:]' '[:lower:]')"
          if ! [[ "${sha_lc}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid expected_sha — must be exactly 40 hexadecimal characters (a full commit SHA, never abbreviated, no whitespace or extra text)."
            exit 1
          fi
          if [ "${DRY_RUN}" != "true" ] && [ "${DRY_RUN}" != "false" ]; then
            echo "::error::Invalid dry_run value '${DRY_RUN}' — expected true or false."
            exit 1
          fi
          # Normalise the SHA to lowercase for every later comparison.
          echo "EXPECTED_SHA=${sha_lc}" >> "$GITHUB_ENV"
          echo "Validated: ref=${PRIVATE_REF} expected_sha=${sha_lc} dry_run=${DRY_RUN}"

      # Pull the PRIVATE application source AT THE EXACT TAG being released —
      # never a moving branch. actions/checkout itself fails this step
      # closed if the tag doesn't exist on the private repo. (The `with:`
      # block is not shell-interpolated, so referencing ${{ inputs.ref }}
      # directly here — already proven to match the strict version pattern
      # above — is safe.)
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: AXON-APP2026/MANDEM-AI
          ref: refs/tags/${{ inputs.ref }}
          token: ${{ secrets.SOURCE_TOKEN }}

      # ── SOURCE-SHA GUARD — the one check nothing else here provides: that
      # the tag actually resolves to the SPECIFIC commit that was reviewed
      # and approved, not just to A commit with the right version number in
      # package.json. Logs the real checked-out SHA (never a secret) either
      # way, and fails closed on any mismatch — a tag can be moved/re-pointed
      # after review; this is what catches that.
      - name: Verify source commit SHA
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "Requested private tag:              ${PRIVATE_REF}"
          echo "Checked-out private-source commit:  ${actual_sha}"
          if [ "${actual_sha}" != "${EXPECTED_SHA}" ]; then
            echo "::error::Checked-out commit (${actual_sha}) does not match the approved expected_sha (${EXPECTED_SHA}) supplied to this run. The private tag '${PRIVATE_REF}' may have been moved/re-pointed after review, or the wrong SHA was entered. Refusing to build."
            exit 1
          fi
          echo "ACTUAL_SHA=${actual_sha}" >> "$GITHUB_ENV"
          echo "Verified: checked-out commit matches the approved release SHA."

      # Single source of truth for the pinned toolchain version — .nvmrc, also
      # used by local `nvm use`. package.json's engines.node (checked below)
      # must describe the same floor; keep the two reconciled by hand (they
      # rarely change — only when the pdfjs-dist/Electron Node requirement does).
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Print runtime diagnostics (no secrets)
        shell: bash
        run: |
          echo "Node version:   $(node --version)"
          echo "npm version:    $(npm --version)"
          echo "npm registry:   $(npm config get registry)"
          echo "npm cache dir:  $(npm config get cache)"
          echo "Runner:         ${{ runner.os }}/${{ runner.arch }}"

      # ── ENGINE GUARD — fail fast, before any install/network activity ───────
      # pdfjs-dist@6.1.200 (and any future dependency with the same floor)
      # requires Node >=22.13.0. A bad pin here must be caught immediately with
      # a plain-English message, not surfaced later as a confusing install
      # failure three steps downstream.
      - name: Enforce pinned Node engine (fail fast, before install)
        shell: bash
        run: |
          node -e '
            const pkg = require("./package.json");
            const wanted = pkg.engines && pkg.engines.node;
            if (!wanted) { console.error("::error::package.json is missing engines.node - cannot verify the runner Node version."); process.exit(1); }
            const m = wanted.match(/^>=\s*(\d+)\.(\d+)\.(\d+)\s*<\s*(\d+)\.(\d+)\.(\d+)$/);
            if (!m) { console.error("::error::Unrecognised engines.node range: " + wanted); process.exit(1); }
            const [, fMaj, fMin, fPatch, cMaj, cMin, cPatch] = m.map(Number);
            const [aMaj, aMin, aPatch] = process.version.slice(1).split(".").map(Number);
            const geFloor = aMaj > fMaj || (aMaj === fMaj && (aMin > fMin || (aMin === fMin && aPatch >= fPatch)));
            const ltCeil = aMaj < cMaj || (aMaj === cMaj && (aMin < cMin || (aMin === cMin && aPatch < cPatch)));
            if (!geFloor || !ltCeil) {
              console.error("::error::Node " + process.version + " does not satisfy engines.node (" + wanted + "). pdfjs-dist@" + pkg.dependencies["pdfjs-dist"] + " requires Node >=22.13.0. Fix the node-version pinned via actions/setup-node (.nvmrc) in this workflow - never loosen engines.node to hide the mismatch.");
              process.exit(1);
            }
            console.log("Node " + process.version + " satisfies engines.node (" + wanted + ").");
          '

      # ── VERSION GUARD — an ADDITIONAL check, never a substitute for the
      # SHA guard above. Compares the requested tag's version number against
      # the PRIVATE source's package.json AT THE EXACT COMMIT SHA-verified
      # above — not "main", not any moving ref.
      - name: Verify the checkout matches the tag
        shell: bash
        run: |
          set -euo pipefail
          want="${PRIVATE_REF#v}"
          have="$(node -p "require('./package.json').version")"
          echo "tag=${want} package.json=${have}"
          if [ "${want}" != "${have}" ]; then
            echo "::error::Refusing to build: tag v${want} but the checked-out private source's package.json says ${have}. Refusing to build."
            exit 1
          fi
          echo "APP_VERSION=${have}" >> "$GITHUB_ENV"

      - name: Resolve pinned Electron version (cache key)
        id: electron-version
        shell: bash
        run: |
          v="$(node -p "require('./package-lock.json').packages['node_modules/electron'].version")"
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "Pinned Electron version (from package-lock.json): ${v}"

      # Cache the Electron binary + electron-builder's own auxiliary downloads
      # (nsis, winCodeSign, etc.) so a warm run never touches the network for
      # them at all — the socket-hang-up failure mode can only happen on an
      # actual download, so the best fix for it is not needing one. Key on
      # OS + arch + the exact pinned Electron version + the lockfile hash, so a
      # dependency bump or an Electron version bump both invalidate cleanly
      # instead of serving a stale/mismatched binary.
      - name: Restore Electron + electron-builder download cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-electron-${{ steps.electron-version.outputs.version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-electron-${{ steps.electron-version.outputs.version }}-
            ${{ runner.os }}-${{ runner.arch }}-electron-

      # ── INSTALL — npm ci only, scripts + engine checks run for real ─────────
      # No --ignore-scripts (Electron's postinstall download must run — the
      # packaged app needs the real binary), no --ignore-engines, no --force,
      # no falling back to `npm install`. Retried a BOUNDED number of times
      # (never infinite) with increasing backoff: a transient socket hang-up
      # downloading the Electron binary is very likely to succeed on a second
      # attempt, especially now that a warm cache means most attempts need no
      # download at all. npm ci always deletes and recreates node_modules
      # itself before installing (this is npm's own documented, safe behaviour,
      # not a workaround we add) — the EPERM warnings historically seen here
      # are the OS still releasing file handles from the PREVIOUS interrupted
      # attempt's crashed download/antivirus scan; the backoff sleep between
      # attempts gives Windows time to release those handles before npm ci's
      # own cleanup runs again. We never manually delete node_modules or any
      # other path ourselves.
      - name: Install dependencies (npm ci, bounded retries)
        id: install
        shell: bash
        run: |
          set -uo pipefail
          max_attempts=3
          attempt=1
          until npm ci; do
            code=$?
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::npm ci failed after ${attempt} attempt(s) (exit ${code}). See the log above for the exact failing package/command."
              exit "$code"
            fi
            wait_s=$((attempt * 20))
            echo "::warning::npm ci attempt ${attempt} failed (exit ${code}) — retrying in ${wait_s}s (bounded: ${max_attempts} attempts total, never infinite)."
            sleep "$wait_s"
            attempt=$((attempt + 1))
          done
          echo "npm ci succeeded on attempt ${attempt}."

      # Only runs if install exhausted its retries — attributes the failure
      # instead of leaving "npm error code 1" to be misread as a source bug.
      - name: Diagnose install failure (network attribution, no secrets)
        if: failure() && steps.install.outcome == 'failure'
        shell: bash
        run: |
          echo "::group::Network + registry diagnostics"
          echo "npm registry config: $(npm config get registry)"
          node -e "require('dns').lookup('registry.npmjs.org', (e,a)=>console.log('DNS registry.npmjs.org ->', e ? e.message : a))"
          node -e "require('dns').lookup('github.com', (e,a)=>console.log('DNS github.com ->', e ? e.message : a))"
          npm ping || echo "npm ping to the configured registry failed or timed out (see above)."
          echo "::endgroup::"
          echo "::error::npm ci did not complete after retries. This is most likely a NETWORK failure (npm registry, Electron's GitHub-hosted binary download, or GitHub-runner networking) rather than a source-code defect — unless the 'Install dependencies' log above shows a genuine dependency-resolution or lockfile error. Compare the DNS/ping results above against the failing package path in that log to attribute the cause (registry vs. Electron binary vs. DNS/TLS/proxy vs. runner networking)."

      - name: Report resolved dependency versions
        shell: bash
        run: npm ls pdfjs-dist electron --depth=0

      # Proves the postinstall download actually completed and produced a
      # runnable binary — not just that a directory exists. `electron
      # --version` is Electron's own documented smoke-test invocation: it
      # prints the version and exits without opening a window, so it's safe
      # headless on both matrix OSes.
      - name: Verify Electron installation
        shell: bash
        run: |
          set -e
          pkg_version="$(node -p "require('./node_modules/electron/package.json').version")"
          bin_version="$(npx --no-install electron --version | sed 's/^v//')"
          echo "Electron package.json version: ${pkg_version}"
          echo "Electron binary reports:       ${bin_version}"
          if [ "${pkg_version}" != "${bin_version}" ]; then
            echo "::error::Electron's installed binary (${bin_version}) does not match its package.json version (${pkg_version}) — the postinstall download is stale, partial, or corrupted."
            exit 1
          fi
          node -e "const p = require('./node_modules/pdfjs-dist/package.json'); console.log('pdfjs-dist ' + p.version + ' resolved OK — requires Node ' + p.engines.node + ', running Node ' + process.version + '.');"

      - name: Typecheck
        shell: bash
        run: npm run typecheck

      # ── RELEASE GATE — no green, no publish ─────────────────────────────────
      # Runs the invariant harness against the REAL data layer (read-back
      # verified) + static source scans. A single failing invariant fails this
      # step, so the build never reaches the publish step. The report is uploaded
      # below so the board can be read WITHOUT logs. Runs in BOTH dry-run and
      # real modes — it's verification, not publishing.
      - name: Verify invariants (release gate)
        run: npm run verify

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report-${{ matrix.os }}
          path: VERIFICATION-REPORT.md

      # ── EXISTING-RELEASE GUARD — runs in BOTH modes (dry run reports only;
      # a real run fails closed). Prevents ever silently overwriting or
      # altering an already-published public release for this version. `gh`
      # ships preinstalled on every GitHub-hosted runner image (Windows +
      # macOS alike), so no extra setup is needed.
      - name: Check for an existing public release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${PRIVATE_REF}"
          if gh release view "${tag}" --repo AXON-APP2026/MANDEM-AI-releases >/dev/null 2>&1; then
            echo "RELEASE_EXISTS=true" >> "$GITHUB_ENV"
            echo "A public release for ${tag} already exists."
            if [ "${DRY_RUN}" != "true" ]; then
              echo "::error::Refusing to publish: a public release ${tag} already exists on AXON-APP2026/MANDEM-AI-releases. This workflow never overwrites, modifies, or adds assets to an existing release — bump to a new version if this is intentional."
              exit 1
            fi
            echo "Dry run — reporting only; no release will be created or altered."
          else
            echo "RELEASE_EXISTS=false" >> "$GITHUB_ENV"
            echo "No existing public release for ${tag}."
          fi

      # ── DURABLE PROVENANCE EVIDENCE — written to the job summary (not just
      # the step log) so it survives as readable, discoverable release
      # evidence per OS leg, without needing to open raw logs. No secrets.
      - name: Record provenance in job summary
        shell: bash
        run: |
          {
            echo "### Release provenance — ${{ matrix.os }}"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Private repository | AXON-APP2026/MANDEM-AI |"
            echo "| Private tag | \`${PRIVATE_REF}\` |"
            echo "| Expected SHA | \`${EXPECTED_SHA}\` |"
            echo "| Actual checked-out SHA | \`${ACTUAL_SHA}\` |"
            echo "| SHA verification | PASS (actual == expected) |"
            echo "| Application version | \`${APP_VERSION}\` |"
            echo "| OS matrix leg | \`${{ matrix.os }}\` |"
            echo "| Dry run | \`${DRY_RUN}\` |"
            echo "| Existing public release for this version | \`${RELEASE_EXISTS}\` |"
            echo "| Workflow run ID | \`${{ github.run_id }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Signing/notarisation/publishing below this line are REAL-RUN ONLY —
      # every one of these three steps carries an explicit dry_run guard, so
      # a dry run cannot reach any of them regardless of what else happens.
      - name: Import Apple certificate (macOS only)
        if: matrix.os == 'macos-latest' && inputs.dry_run == false
        run: |
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          echo "CSC_LINK=$RUNNER_TEMP/cert.p12" >> $GITHUB_ENV
          echo "CSC_KEY_PASSWORD=$APPLE_CERTIFICATE_PASSWORD" >> $GITHUB_ENV
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      # The production application build itself is explicitly ALLOWED in a
      # dry run (it's verification that the source builds, not publishing),
      # so this step stays unconditional.
      - name: Build renderer (vite)
        shell: bash
        run: npm run build
        env:
          VITE_HUB_URL: ${{ vars.VITE_HUB_URL }}
          VITE_HELP_URL: ${{ vars.VITE_HELP_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ vars.VITE_GOOGLE_CLIENT_SECRET }}
          VITE_GMAIL_READONLY: ${{ vars.VITE_GMAIL_READONLY }}
          # Outlook/Microsoft 365 integration — was missing from this file
          # (present in the private repo's reference copy only), so a public
          # release build silently shipped without Outlook configured. Added
          # to close that drift while realigning the two files.
          VITE_MS_CLIENT_ID: ${{ vars.VITE_MS_CLIENT_ID }}

      # Packaging only, now that verify/typecheck/build each have their own
      # named step above — a failure here means packaging specifically, not
      # "something in this multi-command blob broke." Same-repo publish: the
      # automatic GITHUB_TOKEN can create releases in THIS public repo
      # (contents: write above). electron-builder reads the target owner/repo
      # from package.json `publish` (AXON-APP2026/MANDEM-AI-releases), which is
      # exactly this repo. REAL-RUN ONLY — see the dry_run guard below.
      #
      # KNOWN RISK (release-provenance sprint, 25/09/2026) — this step still
      # publishes PER OS, independently: whichever matrix leg reaches here
      # and succeeds updates the shared GitHub Release immediately, with no
      # dependency on the OTHER OS's outcome. This is why v0.11.0 shipped a
      # Windows-only release when macOS failed at code-signing. A proposed
      # fix (build both OSes to artifacts, publish once in a separate job
      # that needs: build) has been reported separately but is NOT applied
      # here — see the release-provenance report for the exact diff.
      - name: Package with electron-builder (and publish)
        if: inputs.dry_run == false
        shell: bash
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code-signing + notarisation (no-op on Windows).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Dry run complete
        if: inputs.dry_run == true
        shell: bash
        run: echo "Dry run complete for ${{ matrix.os }} — provenance verified, source built. No signing, notarisation, or publishing occurred. See the job summary for the full provenance record."
